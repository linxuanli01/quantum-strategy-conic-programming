[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "quantum-strategy-conic"
version = "0.2.0"
description = "Conic optimization of multiparameter quantum-metrology strategies"
readme = "README.md"
requires-python = ">=3.9"
authors = [
  {name = "Linxuan Li"},
  {name = "Zihao Hu"},
  {name = "Longyun Chen"},
  {name = "Yuxiang Yang"},
  {name = "Haidong Yuan"},
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
  "cvxpy>=1.4,<2",
  "numpy>=1.23,<3",
  "scipy>=1.9,<2",
]

[project.optional-dependencies]
mosek = ["Mosek>=10.1,<12"]
dev = ["pytest>=7,<9", "ruff>=0.8,<1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
